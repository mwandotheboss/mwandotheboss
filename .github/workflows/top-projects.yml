name: Update top projects

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays at 06:00 Nairobi time
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/update-top-projects.mjs
      - .github/workflows/top-projects.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild the top projects table
        run: node scripts/update-top-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update top projects" README.md
          git push
